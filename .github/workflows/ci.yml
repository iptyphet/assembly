name: ci

on:
  pull_request:
    branches: [main]
    paths: ['dotnet/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['dotnet/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet/Assembly.slnx

      - name: Build
        run: dotnet build dotnet/Assembly.slnx -c Release --no-restore

      - name: Validate Bicep
        run: |
          az bicep install
          az bicep build --file dotnet/infra/main.bicep --stdout > /dev/null
